spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mDosthi?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mDosthi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
imedix.center.code=${IMEDIX_CENTER_CODE:VBCR019}
secretkey=${SECRETKEY:change-me}
server.port=9090
#UTF-8 Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# M-Dosthi Model Configuration - English (default)
ollama.base.url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model.en=${OLLAMA_MODEL_EN:llama3.2:3b}
ollama.timeout=45000
ollama.speech.enabled=${OLLAMA_TTS_ENABLED:true}
ollama.speech.model=${OLLAMA_TTS_MODEL:phonon}
ollama.speech.voice=${OLLAMA_TTS_VOICE:default}
ollama.speech.language=${OLLAMA_TTS_LANGUAGE:en}
ollama.speech.timeout=${OLLAMA_TTS_TIMEOUT:30000}
ollama.speech.max.text.length=${OLLAMA_TTS_MAX_TEXT_LENGTH:12000}
ollama.speech.max.concurrent=${OLLAMA_TTS_MAX_CONCURRENT:2}

# Directory where per-session Ollama request payload logs are written (one file per patient/session)
ollama.log.dir=${OLLAMA_LOG_DIR:./logs/chat}
# Set to false to turn off request-payload logging entirely
ollama.log.payload.enabled=${OLLAMA_LOG_PAYLOAD_ENABLED:true}

# Lightweight multilingual model used for Bengali
ollama.model.bn=${OLLAMA_MODEL_BN:}

# Model Parameters - English (original Llama parameters)
ollama.temperature.en=0.7
ollama.top_p.en=0.9
ollama.top_k.en=50
ollama.repeat_penalty.en=1.2
ollama.num_ctx.en=2048
ollama.max.tokens.en=128
# Number of model layers to offload to GPU. Set to a high value (e.g. 999) to force
# the whole model onto GPU; set to 0 to force CPU-only. Only takes effect if the
# Ollama server itself has GPU access.
ollama.num_gpu.en=0

# Model Parameters - Bengali
ollama.temperature.bn=0.6
ollama.top_p.bn=0.9
ollama.top_k.bn=40
ollama.repeat_penalty.bn=1.1
ollama.num_ctx.bn=2048
ollama.max.tokens.bn=128
ollama.repeat_last_n.bn=128
ollama.frequency_penalty.bn=0.0
ollama.presence_penalty.bn=0.0
ollama.typical_p.bn=0.92
ollama.num_batch.bn=64
# Number of model layers to offload to GPU. Set to a high value (e.g. 999) to force
# the whole model onto GPU; set to 0 to force CPU-only. Only takes effect if the
# Ollama server itself has GPU access.
ollama.num_gpu.bn=0

# Chat Configuration
chat.max.context.messages=30

# Ollama API mode: "generate" (uses /api/generate + template directly, version controlled
#                                by ollama.generate.version below)
#                  "chat"     (uses /api/chat + system role message, system prompt used normally)
ollama.api.mode=chat

# Only consulted when ollama.api.mode=generate. "v1" (default) or "v2" — see the two
# template blocks below.
ollama.generate.version=

# All 4 session-type/language system prompts live in their own .md files under
# resources/prompts/ and are loaded once at startup (OllamaService.loadSystemPrompts()):
#   prompts/en_first_session.md, prompts/bn_first_session.md,
#   prompts/en_follow_up.md,     prompts/bn_follow_up.md

# =====================================================================
# generate v0.1 — ollama.api.mode=generate, ollama.generate.version=v1
# The system prompt text is spliced directly into the user turn, ahead
# of {{ .Prompt }} — the whole rendered template (system + prompt) is
# sent as the "template" field to /api/generate, no separate "system"
# field is used.
# =====================================================================

# Template format - English (Llama 3): system prompt loaded from prompts/en_first_session.md at startup
ollama.template.en_first_session=<|start_header_id|>user<|end_header_id|>{{SYSTEM_PROMPT}}\n{{ .Prompt }}<|eot_id|><|start_header_id|>assistant<|end_header_id|>{{ .Response }}<|eot_id|>

# Template format - Bengali (Gemma3): system prompt loaded from prompts/bn_first_session.md at startup
ollama.template.bn_first_session=<start_of_turn>user\n{{SYSTEM_PROMPT}}\n{{ .Prompt }}<end_of_turn>\n<start_of_turn>model\n{{ .Response }}<end_of_turn>

# system prompt loaded from prompts/en_follow_up.md at startup
ollama.template.en_follow_up=<|start_header_id|>user<|end_header_id|>{{SYSTEM_PROMPT}}\n{{ .Prompt }}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n{{ .Response }}<|eot_id|>

# system prompt loaded from prompts/bn_follow_up.md at startup
ollama.template.bn_follow_up=<start_of_turn>user\n{{SYSTEM_PROMPT}}\n{{ .Prompt }}<end_of_turn>\n<start_of_turn>model\n{{ .Response }}<end_of_turn>

# =====================================================================
# generate v0.2 — ollama.api.mode=generate, ollama.generate.version=v2
# Uses Ollama's native {{ .System }} template variable (the same
# structure Ollama's own Modelfiles ship with) instead of baking the
# system text into the template string. OllamaService sends the loaded
# .md content as a separate "system" field in the /api/generate request
# body, and Ollama substitutes it into {{ .System }} below. Since the
# template carries no prompt-specific text anymore, one structural
# template per language covers both first-session and follow-up.
# =====================================================================

# v0.2 template - English (Llama 3 native Modelfile structure)
ollama.template.v2.en=<|start_header_id|>system<|end_header_id|>\n\n{{ .System }}<|eot_id|><|start_header_id|>user<|end_header_id|>\n\n{{ .Prompt }}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n{{ .Response }}<|eot_id|>

# v0.2 template - Bengali (Gemma3 native Modelfile structure; Gemma has no system
# turn, so Ollama folds {{ .System }} into the leading user turn)
ollama.template.v2.bn=<start_of_turn>user\n{{ .System }}\n\n{{ .Prompt }}<end_of_turn>\n<start_of_turn>model\n{{ .Response }}<end_of_turn>

# =====================================================================
# chat — ollama.api.mode=chat (ollama.generate.version is ignored in this mode)
# The loaded .md system prompt is sent as a normal role:"system" message
# to /api/chat, which is Ollama's intended way of carrying a system
# prompt in chat mode (the "template" field is not part of the
# /api/chat request schema and is ignored if present).
# =====================================================================

# =====================================================================
# Stage-specific follow-up prompts
# When enabled, OllamaService parses the "Stage: <value>" line out of the
# follow-up session's deltaSummary (built in UserRepositoryImpl from
# session_deltas.readiness_after) and, if it matches one of the 6
# stages below (the 5 Transtheoretical Model stages plus Relapse), uses
# that stage's .md prompt instead of the generic en_follow_up/bn_follow_up
# prompt. Applies to all 3 modes (generate v0.1/v0.2, chat) since they
# all funnel through the same stage-resolution helper.
#
# If disabled, OR the stage can't be matched, OR the matched stage's .md
# file is blank, falls back to the existing en_follow_up/bn_follow_up
# prompt — so it's safe to enable before the stage files are filled in.
# =====================================================================
ollama.stage_specific_prompts.enabled=false

ollama.stage.prompt.en.precontemplation=prompts/stages/en_precontemplation.md
ollama.stage.prompt.en.contemplation=prompts/stages/en_contemplation.md
ollama.stage.prompt.en.preparation=prompts/stages/en_preparation.md
ollama.stage.prompt.en.action=prompts/stages/en_action.md
ollama.stage.prompt.en.maintenance=prompts/stages/en_maintenance.md
ollama.stage.prompt.en.relapse=prompts/stages/en_relapse.md

ollama.stage.prompt.bn.precontemplation=prompts/stages/bn_precontemplation.md
ollama.stage.prompt.bn.contemplation=prompts/stages/bn_contemplation.md
ollama.stage.prompt.bn.preparation=prompts/stages/bn_preparation.md
ollama.stage.prompt.bn.action=prompts/stages/bn_action.md
ollama.stage.prompt.bn.maintenance=prompts/stages/bn_maintenance.md
ollama.stage.prompt.bn.relapse=prompts/stages/bn_relapse.md

# Stop sequences - English (Llama 3)
ollama.stop.en=<|start_header_id|>,<|end_header_id|>,<|eot_id|>,<|reserved_special_token>

# WhatsApp Suicide Ideation Alert Configuration
# Recipient phone number (format with country code, e.g. 91XXXXXXXXXX)
imedix.whatsapp.alert.recipient=${IMEDIX_WHATSAPP_ALERT_RECIPIENT:change-me}
# Polling interval in milliseconds (defaults to 10 seconds)
suicide.tracker.delay=10000

# Meta WhatsApp API Credentials
imedix.whatsapp.access-token=${IMEDIX_WHATSAPP_ACCESS_TOKEN:change-me}
imedix.whatsapp.phone-number-id=${IMEDIX_WHATSAPP_PHONE_NUMBER_ID:change-me}
imedix.whatsapp.verify-token=${IMEDIX_WHATSAPP_VERIFY_TOKEN:change-me}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mDosthi}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME:?set SPRING_DATASOURCE_USERNAME in .env}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mDosthi}?useUnicode=true&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?set SPRING_DATASOURCE_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      IMEDIX_CENTER_CODE: ${IMEDIX_CENTER_CODE:-VBCR019}
      SECRETKEY: ${SECRETKEY:?set SECRETKEY in .env}
      OLLAMA_BASE_URL: ${OLLAMA_CONTAINER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LOG_PAYLOAD_ENABLED: ${OLLAMA_LOG_PAYLOAD_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-9090}:9090"
    depends_on:
      mysql:
        condition: service_healthy

  flutter-web:
    build:
      context: .
      dockerfile: docker/flutter.Dockerfile
      target: flutter-web
      args:
        API_HOST: ${FLUTTER_API_HOST:-localhost:${FLUTTER_WEB_PORT:-8081}}
    restart: unless-stopped
    ports:
      - "${FLUTTER_WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started

  legacy-rmi:
    build:
      context: .
      dockerfile: docker/legacy.Dockerfile
    entrypoint: ["/usr/local/bin/legacy-entrypoint.sh"]
    command: ["rmi"]
    restart: unless-stopped
    environment:
      IMEDIX_CENTER_CODE: ${IMEDIX_CENTER_CODE:-VBCR019}
      LEGACY_DB_URL: "jdbc:mysql://mysql:3306/${LEGACY_DB_DATABASE:-${MYSQL_DATABASE:-mDosthi}}?useUnicode=true&characterEncoding=UTF-8"
      LEGACY_DB_USERNAME: ${LEGACY_DB_USERNAME:?set LEGACY_DB_USERNAME in .env}
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:?set LEGACY_DB_PASSWORD in .env}
      LEGACY_FTP_USERNAME: ${LEGACY_FTP_USERNAME:-}
      LEGACY_FTP_PASSWORD: ${LEGACY_FTP_PASSWORD:-}
      LEGACY_RMI_ADVERTISE_HOST: legacy-rmi
    depends_on:
      mysql:
        condition: service_healthy

  legacy-web:
    build:
      context: .
      dockerfile: docker/legacy.Dockerfile
    entrypoint: ["/usr/local/bin/legacy-entrypoint.sh"]
    command: ["web"]
    restart: unless-stopped
    environment:
      IMEDIX_CENTER_CODE: ${IMEDIX_CENTER_CODE:-VBCR019}
      LEGACY_RMI_ADVERTISE_HOST: legacy-rmi
      PACS_UID: ${PACS_UID:-}
      PACS_PASSWORD: ${PACS_PASSWORD:-}
    ports:
      - "${LEGACY_WEB_PORT:-8080}:8080"
    depends_on:
      legacy-rmi:
        condition: service_started

  android-apk:
    build:
      context: .
      dockerfile: docker/flutter.Dockerfile
      target: android-apk
      args:
        API_HOST: ${ANDROID_API_HOST:-10.0.2.2:9090}
        ANDROID_ORG: ${ANDROID_ORG:-com.example}
    profiles: ["build"]
    volumes:
      - ./dist/android:/output

volumes:
  mysql-data:
